<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#161a20">
<title>Studio Home</title>
<script>try{var _k=localStorage.getItem("sr-skin");if(_k&&_k!=="workbench")document.documentElement.dataset.skin=_k}catch(e){}</script>
<style>
/* ═══════════ CutterMaker · workbench theme (base) ═══════════ */
:root{
  color-scheme:dark;
  --bg:#0e1116; --well:#0b0d11; --panel:#161a20; --panel2:#1c2129; --field:#0c0f13;
  --line:#262d37; --line2:#333b47;
  --tx:#e7eaef; --mut:#9aa3b2; --dim:#6b7486;
  --m7:#e6007e; --m7hi:#ff1a92; --m7lo:#c4006a; --onm7:#fff; --c8:#22cbe9; --c8bg:#0d333c; --warn:#ffb020;
  --err:#ff8a8a; --glow:34,203,233; --shadow:0,0,0; --hover:#43505f; --thumb:#333c49; --thumbh:#465163;
  --grid:255,255,255; --ga:.03; --gb:.055;
  --ov1:rgba(11,13,17,.78); --ov2:rgba(18,22,28,.95);
  --ui:"Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --head:"Bahnschrift SemiCondensed","Bahnschrift","Segoe UI Variable Display","Segoe UI",Roboto,sans-serif;
  --num:"Cascadia Mono","Cascadia Code",Consolas,"Roboto Mono","DejaVu Sans Mono",monospace;
}
:root[data-skin=light]{color-scheme:light;--bg:#eef1f5;--well:#d3d9e1;--panel:#ffffff;--panel2:#f3f5f8;--field:#ffffff;--line:#dde2e9;--line2:#c3cad4;--tx:#18202b;--mut:#566273;--dim:#8793a3;--m7:#d6006f;--c8:#0a7fa0;--c8bg:#dff3f8;--warn:#b86e00;--m7hi:#f0007f;--m7lo:#b0005b;--onm7:#fff;--glow:10,127,160;--err:#c62828;--shadow:30,45,70;--hover:#9fabb9;--grid:20,30,50;--ga:.06;--gb:.1;--thumb:#c3cad4}
:root[data-skin=neon]{color-scheme:dark;--bg:#0a0612;--well:#070411;--panel:#120a22;--panel2:#1a0f33;--field:#0b0618;--line:#2b1a52;--line2:#43297d;--tx:#f4eeff;--mut:#b7a6e6;--dim:#7e6bb5;--m7:#ff2bd6;--c8:#00f0ff;--c8bg:#06303a;--warn:#fff200;--m7hi:#ff66e6;--m7lo:#c800a4;--onm7:#fff;--glow:0,240,255;--err:#ff4d6d;--shadow:0,0,0;--hover:#6a47c0;--grid:180,120,255;--ga:.05;--gb:.09;--thumb:#43297d}
:root[data-skin=bauhaus]{color-scheme:light;--bg:#f2efe6;--well:#f7c600;--panel:#f2efe6;--panel2:#ffffff;--field:#ffffff;--line:#111111;--line2:#111111;--tx:#111111;--mut:#444444;--dim:#666666;--m7:#e63222;--c8:#1d3fbb;--c8bg:#dde5ff;--warn:#b45309;--m7hi:#ff4433;--m7lo:#b81f12;--onm7:#fff;--glow:29,63,187;--err:#e63222;--shadow:17,17,17;--hover:#111111;--grid:17,17,17;--ga:.12;--gb:.22;--thumb:#111111}
:root[data-skin=blueprint]{color-scheme:dark;--bg:#0b2a4a;--well:#0a2342;--panel:#0f335c;--panel2:#143e6c;--field:#0a2747;--line:#245585;--line2:#3b72a6;--tx:#eaf4ff;--mut:#a8c8e8;--dim:#7ea3c8;--m7:#ffd23f;--c8:#7fd4ff;--c8bg:#0f4a7a;--warn:#ffd23f;--m7hi:#ffe27a;--m7lo:#d9a800;--onm7:#0b2a4a;--glow:127,212,255;--err:#ff8a80;--shadow:0,0,0;--hover:#5b92c4;--grid:200,230,255;--ga:.05;--gb:.1;--thumb:#3b72a6}

*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--thumb) transparent}
html,body{margin:0;height:100%}
body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--tx);font:14px/1.4 var(--ui);-webkit-tap-highlight-color:transparent}
button,a.btn{font:inherit;font-size:13.5px;height:34px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;background:var(--panel2);color:var(--tx);border:1px solid var(--line2);border-radius:5px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .12s,border-color .12s,color .12s;-webkit-appearance:none;margin:0}
button:hover,a.btn:hover{border-color:var(--hover)}
button:focus-visible,a.btn:focus-visible,.tile:focus-visible{outline:2px solid var(--c8);outline-offset:2px}
.pri{background:var(--m7);border-color:var(--m7);color:var(--onm7);font-weight:600}
.pri:hover{background:var(--m7hi);border-color:var(--m7hi)}

/* ── Header ── */
#appTop{flex:none;height:52px;display:flex;align-items:center;gap:14px;padding:0 12px 0 14px;background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:10px;min-width:0;white-space:nowrap}
.brand svg{flex:none}
.brand b{font:600 21px/1 var(--head);letter-spacing:.2px}
.brand b i{font-style:normal;color:var(--m7)}
.brand small{color:var(--dim);font-size:12px;margin-left:2px;font-family:var(--num)}
.spacer{flex:1}
#skins{display:flex;gap:8px;align-items:center;flex:none}
#skins button{width:22px;height:22px;min-width:22px;padding:0;border-radius:50%!important;border:2px solid var(--line2);cursor:pointer;background:linear-gradient(135deg,var(--s1) 50%,var(--s2) 50%)}
#skins button:hover{border-color:var(--tx)}
#skins button[aria-pressed=true]{outline:2px solid var(--c8);outline-offset:2px;border-color:var(--panel)}

/* ── Logos (shared by tiles and app bar) ── */
.lg{display:block}
.lg .a{fill:none;stroke:var(--m7);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.lg .b{fill:none;stroke:var(--c8);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lg .fa{fill:var(--m7);stroke:none}
.lg .fb{fill:var(--c8);stroke:none}
.lg .d{stroke-dasharray:4 2.5}

/* ── Home ── */
#home{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 24px;
  background-color:var(--well);
  background-image:linear-gradient(rgba(var(--grid),var(--ga)) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--grid),var(--ga)) 1px,transparent 1px),linear-gradient(rgba(var(--grid),var(--gb)) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--grid),var(--gb)) 1px,transparent 1px);
  background-size:20px 20px,20px 20px,100px 100px,100px 100px}
#home h1{margin:0 0 4px;font:600 26px/1.15 var(--head);letter-spacing:.2px;text-align:center}
#home .sub{margin:0 0 22px;color:var(--mut);text-align:center}
#grid{list-style:none;margin:0;padding:0;width:100%;max-width:1280px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.tile{all:unset;box-sizing:border-box;width:100%;height:100%;display:flex;align-items:center;gap:16px;padding:16px 18px;background:var(--panel);border:1px solid var(--line);border-radius:8px;cursor:pointer;position:relative;transition:border-color .14s,transform .14s,box-shadow .14s,background .14s}
.tile:hover{border-color:var(--m7);transform:translateY(-2px);box-shadow:0 8px 22px rgba(var(--shadow),.28)}
.tile:active{transform:translateY(0)}
.tile .ic{flex:none;width:68px;height:68px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;transition:border-color .14s}
.tile:hover .ic{border-color:var(--m7)}
.tile .ic .lg{width:46px;height:46px}
.tile .tx{min-width:0;display:flex;flex-direction:column;gap:5px}
.tile .nm{font:600 18px/1.15 var(--head);letter-spacing:.15px}
.tile .fn{font:12px/1.2 var(--num);color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .key{position:absolute;top:8px;right:10px;font:11px/1 var(--num);color:var(--dim)}
.tile .run{display:none;align-self:flex-start;font:600 11px/1 var(--ui);color:var(--c8);background:var(--c8bg);border:1px solid var(--c8);border-radius:20px;padding:3px 8px}
.tile.open .run{display:inline-block}
#home .foot{margin:22px 0 0;color:var(--dim);font-size:12.5px;text-align:center}

/* ── App view ── */
#appView{flex:1;min-height:0;display:none;flex-direction:column}
body.in-app #home{display:none}
body.in-app #appView{display:flex}
body.in-app #appTop{display:none}
#appBar{flex:none;height:40px;display:flex;align-items:center;gap:8px;padding:0 8px;background:var(--panel);border-bottom:1px solid var(--line)}
#appBar button,#appBar a.btn{height:28px;padding:0 11px;font-size:13px}
#appBar .cur{display:flex;align-items:center;gap:8px;min-width:0;margin-left:4px}
#appBar .cur .lg{width:22px;height:22px;flex:none}
#appBar .cur b{font:600 16px/1 var(--head);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#frames{flex:1;min-height:0;position:relative;background:var(--bg)}
#frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}
#frames iframe.show{display:block}
#missing{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--mut)}
#missing.show{display:flex}
#missing div{max-width:520px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:22px 24px}
#missing b{display:block;color:var(--tx);font:600 18px/1.2 var(--head);margin-bottom:8px}
#missing code{font-family:var(--num);color:var(--c8)}

/* ── Neon extras ── */
:root[data-skin=neon] #appTop,:root[data-skin=neon] #appBar{border-bottom-color:var(--m7);box-shadow:0 1px 18px rgba(255,43,214,.35)}
:root[data-skin=neon] .brand b,:root[data-skin=neon] #home h1{text-shadow:0 0 12px rgba(0,240,255,.65)}
:root[data-skin=neon] .tile:hover{box-shadow:0 0 22px rgba(255,43,214,.45)}
:root[data-skin=neon] .tile:hover .ic{box-shadow:0 0 12px rgba(0,240,255,.4)}
:root[data-skin=neon] .pri{box-shadow:0 0 18px rgba(255,43,214,.6)}

/* ── Bauhaus extras ── */
:root[data-skin=bauhaus] *{border-radius:0!important}
:root[data-skin=bauhaus] #skins button{border-radius:50%!important;border-color:#f2efe6;border-width:2px}
:root[data-skin=bauhaus] #skins button[aria-pressed=true]{outline-color:#f7c600;border-color:#111}
:root[data-skin=bauhaus] #appTop,:root[data-skin=bauhaus] #appBar{background:#111;border-bottom:4px solid var(--m7)}
:root[data-skin=bauhaus] .brand b,:root[data-skin=bauhaus] .brand small,:root[data-skin=bauhaus] #appBar .cur b{color:#f2efe6}
:root[data-skin=bauhaus] #appBar button:not(.pri),:root[data-skin=bauhaus] #appBar a.btn{background:transparent;color:#f2efe6;border:2px solid #f2efe6}
:root[data-skin=bauhaus] #appBar button:not(.pri):hover,:root[data-skin=bauhaus] #appBar a.btn:hover{background:#f2efe6;color:#111}
:root[data-skin=bauhaus] #appBar .pri{border:2px solid #f2efe6}
:root[data-skin=bauhaus] #home h1{text-transform:uppercase;font-weight:800;letter-spacing:.5px}
:root[data-skin=bauhaus] .tile{border:2px solid #111;box-shadow:4px 4px 0 #111;background:#fff}
:root[data-skin=bauhaus] .tile:hover{box-shadow:7px 7px 0 #111;transform:translate(-3px,-3px);border-color:#111}
:root[data-skin=bauhaus] .tile:active{box-shadow:1px 1px 0 #111;transform:translate(2px,2px)}
:root[data-skin=bauhaus] .tile .ic{border:2px solid #111;background:#f2efe6}
:root[data-skin=bauhaus] .tile:hover .ic{background:#f7c600;border-color:#111}
:root[data-skin=bauhaus] .tile .nm{text-transform:uppercase;font-weight:800;letter-spacing:.4px;font-size:16px}
:root[data-skin=bauhaus] .tile .run{border-radius:0!important}
:root[data-skin=bauhaus] #missing div{border:3px solid #111;border-top:6px solid var(--m7);box-shadow:8px 8px 0 #111}

/* ── Responsive ── */
@media (max-width:1100px){
  #grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tile{gap:12px;padding:14px}
  .tile .ic{width:56px;height:56px}
  .tile .ic .lg{width:38px;height:38px}
  .tile .nm{font-size:16px}
}
/* Tablets and phones: launcher-style 3×4, logo above name */
@media (max-width:820px){
  :root[data-skin=bauhaus] .tile .nm{font-size:13.5px}
  #home{padding:18px 12px;justify-content:flex-start}
  #home h1{font-size:22px}
  #home .sub{margin-bottom:16px;font-size:13px}
  #grid{gap:10px}
  .tile{flex-direction:column;justify-content:flex-start;text-align:center;gap:8px;padding:14px 6px 12px}
  .tile .tx{align-items:center;gap:4px}
  .tile .nm{font-size:14.5px}
  .tile .fn{display:none}
  .tile .key{display:none}
  .tile .run{align-self:center;font-size:10px;padding:2px 6px}
  .tile .ic{width:58px;height:58px}
  .tile .ic .lg{width:40px;height:40px}
}
@media (max-width:520px){
  #appTop{gap:8px;padding:0 8px 0 10px}
  .brand b{font-size:18px}
  .brand small{display:none}
  #skins{gap:6px}
  #skins button{width:19px;height:19px;min-width:19px}
  #grid{gap:8px}
  .tile{padding:12px 4px 10px;gap:7px}
  .tile .nm{font-size:13px}
  .tile .ic{width:50px;height:50px}
  .tile .ic .lg{width:34px;height:34px}
  #appBar{gap:6px;padding:0 6px}
  #appBar button,#appBar a.btn{padding:0 8px;font-size:12.5px}
  #appBar .cur b{font-size:14px}
  :root[data-skin=bauhaus] .tile .nm{font-size:12px;letter-spacing:.2px}
  .lf{display:none}
  #newTab{display:none}
}
@media (max-width:360px){
  .brand svg{width:24px;height:24px}
  .brand b{font-size:16px}
  #skins{gap:5px}
  #skins button{width:17px;height:17px;min-width:17px}
  .tile .nm{font-size:12px}
  #appBar .cur .lg{display:none}
}
/* Short screens on desktop: tighten so all twelve stay in view */
@media (min-width:821px) and (max-height:700px){
  #home{padding:16px 24px}
  #home .sub{margin-bottom:14px}
  #grid{gap:12px}
  .tile{padding:12px 16px}
  #home .foot{margin-top:14px}
}
</style>
</head>

<header id="appTop">

<main id="home">

</main>

<section id="appView" aria-live="polite">
  <div id="appBar">
    <button id="back" class="pri" type="button" title="Back to the home page (apps you opened stay open)">Back<span class="lf">&nbsp;to Home</span></button>
    <div class="cur"><span id="curLogo"></span><b id="curName"></b></div>
    <div class="spacer"></div>
    <button id="reload" type="button" title="Reload this app">Reload</button>
    <a id="newTab" class="btn" target="_blank" rel="noopener" title="Open this app on its own in a new browser tab">New tab</a>
    <button id="closeApp" type="button" title="Close this app and go back to the home page">Close</button>
  </div>
  <div id="frames">
    <div id="missing"><div><b>App file not found</b>Put <code id="missFile"></code> in the same folder as this home page, then press Reload.</div></div>
  </div>
</section>

  logo:'<rect class="a" x="3" y="3" width="26" height="26" rx="2"/><rect class="b d" x="7.5" y="7.5" width="17" height="17"/><rect class="fb" x="11.5" y="11.5" width="9" height="9" opacity=".35"/><rect class="b" x="11.5" y="11.5" width="9" height="9"/>'},
 {id:"pdf-reports",name:"PDF Reports",file:"PDF_Reports.html",
  logo:'<path class="a" d="M7 3h12l7 7v19H7z"/><path class="a" d="M19 3v7h7"/><path class="b" d="M11 25v-5M15.5 25v-9M20 25v-7"/><path class="b" d="M10 25.5h12"/>'},
 {id:"chaos-studio",name:"Chaos Studio",file:"ChaosStudio.html",
  logo:'<rect class="a" x="3" y="3" width="26" height="26" rx="6"/><path class="b" d="M7 12h7M17 12h8M9 16.5h11M7 21h4M14 21h11"/><rect class="fa" x="19" y="8.5" width="5" height="2.5"/><rect class="fb" x="10" y="18" width="5" height="2" opacity=".6"/><circle class="fa" cx="22" cy="24" r="1.6"/>'}
];
const KEYS=["1","2","3","4","5","6","7","8","9","0","-","="];
const svg=(a,cls="lg")=>`<svg class="${cls}" viewBox="0 0 32 32" aria-hidden="true">${a.logo}</svg>`;
const $=id=>document.getElementById(id);
const root=document.documentElement;

/* ── Skins (shared key "sr-skin" with every app) ── */
function applySkin(k){
  if(!k||k==="workbench")delete root.dataset.skin;else root.dataset.skin=k;
  const cur=root.dataset.skin||"workbench";
  document.querySelectorAll("#skins button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.skin===cur?"true":"false"));
  const bg=getComputedStyle(root).getPropertyValue("--panel").trim();
  const m=document.querySelector('meta[name="theme-color"]');if(m&&bg)m.content=root.dataset.skin==="bauhaus"?"#111111":bg;
}
function readSkin(){try{return localStorage.getItem("sr-skin")}catch(e){return null}}
$("skins").addEventListener("click",e=>{
  const b=e.target.closest("button[data-skin]");if(!b)return;
  try{localStorage.setItem("sr-skin",b.dataset.skin)}catch(_){}
  applySkin(b.dataset.skin);
});
/* An app changing its skin updates this page too */
addEventListener("storage",e=>{if(e.key==="sr-skin")applySkin(e.newValue)});
applySkin(readSkin());

/* ── Tiles ── */
$("grid").innerHTML=APPS.map((a,i)=>`<li><button class="tile" type="button" data-id="${a.id}" title="Open ${a.name}">
  <span class="ic">${svg(a)}</span>
  <span class="tx"><span class="nm">${a.name}</span><span class="fn">${a.file}</span><span class="run">Open</span></span>
  <span class="key">${KEYS[i]}</span></button></li>`).join("");
$("grid").addEventListener("click",e=>{const t=e.target.closest(".tile");if(t)openApp(t.dataset.id,true)});

/* ── Open / back ── */
const frames={};let current=null;
function byId(id){return APPS.find(a=>a.id===id)}
function markOpen(){document.querySelectorAll(".tile").forEach(t=>t.classList.toggle("open",!!frames[t.dataset.id]))}
async function fileMissing(a){
  if(!/^https?:$/.test(location.protocol))return false; // can't check from a local file; the browser shows its own error
  try{const r=await fetch(a.file,{method:"HEAD",cache:"no-store"});return r.status===404}catch(e){return false}
}
async function openApp(id,push){
  const a=byId(id);if(!a)return;
  current=a;
  $("curLogo").innerHTML=svg(a);$("curName").textContent=a.name;
  $("newTab").href=a.file;document.title=a.name+" · Studio Home";
  document.body.classList.add("in-app");
  if(push)history.pushState({app:id},"","#"+id);
  Object.values(frames).forEach(f=>f.classList.remove("show"));
  $("missing").classList.remove("show");
  if(!frames[id]){
    if(await fileMissing(a)){$("missFile").textContent=a.file;$("missing").classList.add("show");return}
    const f=document.createElement("iframe");
    f.title=a.name;f.src=a.file;f.setAttribute("allow","clipboard-read; clipboard-write; fullscreen");f.allowFullscreen=true;
    $("frames").appendChild(f);frames[id]=f;markOpen();
  }
  frames[id].classList.add("show");
  try{frames[id].focus()}catch(e){}
}
function showHome(){
  document.body.classList.remove("in-app");
  Object.values(frames).forEach(f=>f.classList.remove("show"));
  current=null;document.title="Studio Home";
  applySkin(readSkin()); // pick up a skin chosen inside an app
}
function goHome(){if(history.state&&history.state.app)history.back();else{history.replaceState(null,"",location.pathname+location.search);showHome()}}
$("back").addEventListener("click",goHome);
$("reload").addEventListener("click",()=>{
  if(!current)return;const f=frames[current.id];
  if(f){f.src=current.file}else openApp(current.id,false);
});
$("closeApp").addEventListener("click",()=>{
  if(!current)return;const f=frames[current.id];
  if(f){f.remove();delete frames[current.id];markOpen()}
  goHome();
});
addEventListener("popstate",e=>{
  const id=(e.state&&e.state.app)||location.hash.slice(1);
  if(id&&byId(id))openApp(id,false);else showHome();
});
/* Keys 1–9, 0, - and = open an app from the home page */
addEventListener("keydown",e=>{
  if(document.body.classList.contains("in-app")||e.ctrlKey||e.metaKey||e.altKey)return;
  const n=KEYS.indexOf(e.key);if(n>=0&&APPS[n])openApp(APPS[n].id,true);
});
/* Open straight into an app from a link like index.html#pdf-studio */
(function(){const id=location.hash.slice(1);if(id&&byId(id)){history.replaceState(null,"",location.pathname+location.search);history.pushState({app:id},"","#"+id);openApp(id,false)}})();
</script>
</body>
</html>
